spring:
  application:
    name: demo05-springboot-aop-tx
  profiles:
    active: mysql
server:
  port: 8080
  servlet:
    context-path: /

# mybatis 配置：彻底抛弃mybatis-config.xml文件
# mapperxml文件的位置，settings的配置，别名的配置
mybatis:
  mapper-locations: classpath:/mappers/*.xml
  type-aliases-package: com.study.pojo
  configuration:
    map-underscore-to-camel-case: true
    auto-mapping-behavior: full
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl